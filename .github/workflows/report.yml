name: Process Image Report

on:
  repository_dispatch:
    types: [image_reported]

jobs:
  create-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Create Issue
        uses: imjohnbo/issue-bot@v3
        with:
          assignees: ""
          labels: "content-report"
          title: "Report: ${{ github.event.client_payload.reason }}"
          body: |
            ### Image Reported for Removal
            
            **Reason:** ${{ github.event.client_payload.reason }}
            **Additional Details:** ${{ github.event.client_payload.details }}
            
            **Tweet ID:** `${{ github.event.client_payload.tweetId }}`
            **Image URL:** ${{ github.event.client_payload.imageUrl }}
            
            _Review this report and if valid, add the ID or Image URL to `blacklist.json` and close this issue._
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
