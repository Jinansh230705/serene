name: Delete Bot

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  delete:
    if: github.event.issue.state == 'open' && contains(github.event.comment.body, '@bot confirm delete') && (github.actor == github.event.repository.owner.login || github.actor == 'Jinansh230705')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install mongodb
        run: npm install mongodb
        
      - name: Run Delete Script
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: node scripts/github-delete.js
